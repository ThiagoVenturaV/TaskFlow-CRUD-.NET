services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/TaskFlow.API/Dockerfile
    container_name: taskflow_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=taskflow;Username=postgres;Password=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - Jwt__SecretKey=${JWT_SECRET:?set JWT_SECRET in .env}
      - Jwt__Issuer=TaskFlowAPI
      - Jwt__Audience=TaskFlowClient
      - AllowedOrigins__0=${ALLOWED_ORIGIN:-http://localhost:4200}
    ports:
      - "5000:8080"

volumes:
  taskflow_data:
